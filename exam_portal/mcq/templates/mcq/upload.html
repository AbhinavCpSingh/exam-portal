{% extends "base.html" %}
{% block content %}

<style>
  body {
    background: linear-gradient(135deg, #eef2f3, #8e9eab);
    font-family: "Poppins", sans-serif;
  }

  .upload-card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    padding: 40px;
    transition: all 0.3s ease-in-out;
  }

  .upload-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  }

  .upload-header {
    text-align: center;
    background: linear-gradient(90deg, #007bff, #00bcd4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .form-label {
    font-weight: 600;
    color: #333;
  }

  select, input[type="text"], input[type="file"] {
    border: 2px solid #ddd;
    border-radius: 12px;
    padding: 10px 14px;
    width: 100%;
    transition: all 0.3s ease;
  }

  select:focus, input:focus {
    border-color: #00bcd4;
    outline: none;
    box-shadow: 0 0 10px rgba(0, 188, 212, 0.3);
  }

  .upload-btn {
    background: linear-gradient(90deg, #007bff, #00bcd4);
    border: none;
    padding: 12px 40px;
    border-radius: 25px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .upload-btn:hover {
    background: linear-gradient(90deg, #0056b3, #0097a7);
    transform: translateY(-2px);
  }

  .alert {
    border-radius: 12px;
    padding: 12px 20px;
    font-weight: 500;
  }

  .success {
    background-color: #e6ffed;
    color: #006400;
    border: 1px solid #00b300;
  }

  .error {
    background-color: #ffeaea;
    color: #b30000;
    border: 1px solid #ff4d4d;
  }

  .form-section {
    background-color: #f9fafc;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .icon {
    font-size: 24px;
    margin-right: 10px;
    vertical-align: middle;
    color: #00bcd4;
  }
</style>

<div class="container mt-5 mb-5">
  <div class="upload-card">
    <h2 class="upload-header mb-4"><i class="icon fas fa-cloud-upload-alt"></i>Upload Categorized MCQs</h2>
    <hr>
    {% if messages %}
      <div class="mt-4">
        {% for message in messages %}
          <div class="alert {% if 'success' in message.tags %}success{% else %}error{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-section">
        <label class="form-label"><i class="icon fas fa-folder-open"></i>Category</label>
        {{ form.category }}
      </div>

      <div class="form-section">
        <label class="form-label"><i class="icon fas fa-book"></i>Quiz Title</label>
        {{ form.quiz_title }}
      </div>

      <div class="form-section">
        <label class="form-label"><i class="icon fas fa-file-word"></i>Word File (.docx)</label>
        {{ form.file }}
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="upload-btn"><i class="fas fa-upload me-2"></i>Upload</button>
      </div>
    </form>
  </div>
</div>

<!-- Font Awesome Icons -->
<script src="https://kit.fontawesome.com/a2e0e9b6d3.js" crossorigin="anonymous"></script>

{% endblock %}
