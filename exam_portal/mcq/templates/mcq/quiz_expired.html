{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 via-blue-50 to-indigo-50">
    <div class="bg-white/95 backdrop-blur-sm shadow-xl rounded-2xl px-8 py-10 w-full max-w-md text-center border border-gray-100">
        
        <!-- Quiz Title -->
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">{{ quiz.title }}</h2>

        <!-- Expired Notice -->
        <div class="flex items-center justify-center gap-2 text-red-500 text-base font-medium mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" 
                 class="h-6 w-6 animate-pulse" 
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M12 8v4m0 4h.01M12 2a10 10 0 110 20 10 10 0 010-20z" />
            </svg>
            <span>This quiz has expired.</span>
        </div>

        <!-- Go Back Button -->
        <a href="{% url 'student_dashboard' %}" 
           class="inline-flex items-center justify-center gap-1 px-6 py-2.5 text-white font-medium text-sm rounded-lg
                  bg-gradient-to-r from-blue-600 to-indigo-600 shadow-md shadow-blue-100 
                  hover:from-blue-700 hover:to-indigo-700 hover:scale-[1.02]
                  transition-all duration-300 ease-in-out">
            <svg xmlns="http://www.w3.org/2000/svg" 
                 class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M15 19l-7-7 7-7" />
            </svg>
            Go Back
        </a>

        <!-- Footer Help Text -->
        <p class="mt-6 text-xs text-gray-500">Need help? Contact your instructor.</p>
    </div>
</div>
{% endblock %}
